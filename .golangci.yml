version: "2"

run:
  timeout: 2m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (*io.PipeWriter).Close
        - (io.ReadCloser).Close
        - (*compress/gzip.Reader).Close
